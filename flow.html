<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家づくりの流れ | KOMAI HOME</title>
    <meta name="description" content="こまいホームでの家づくりの流れ。ご契約予定日を入力すると、お引き渡しまでのロードマップをシミュレーションできます。">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KOMAI HOME">
    <meta property="og:title" content="家づくりの流れ | KOMAI HOME">
    <meta property="og:description" content="こまいホームでの家づくりの流れ。ご契約予定日を入力すると、お引き渡しまでのロードマップをシミュレーションできます。">
    <meta property="og:image" content="https://komai-home.co.jp/images/common/icon/ogp.png">
    <meta property="og:url" content="https://komai-home.co.jp/flow.html">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="images/common/icon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/common/icon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/common/icon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/common/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/common/icon/icon-512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/style.css?v=3">
    <script src="js/ga-init.js"></script>
</head>
<body>

    <div class="wrapper">
        <main class="sub-main flow-main">
            <h1 class="page-title">FLOW</h1>
            <p class="page-subtitle">〜 ご契約までの流れ 〜</p>

            <div class="simulator-box">
                <h3 class="simulator-title">SCHEDULE SIMULATOR</h3>
                <p class="simulator-desc">ご契約予定日と建物の種類から、完成までのロードマップを可視化します。</p>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>ご契約予定日</label>
                        <input type="date" id="contractDate" class="stylish-input" required>
                    </div>
                    <div class="form-group">
                        <label>建物のタイプ</label>
                        <select id="buildingType" class="stylish-input">
                            <option value="0">平屋</option>
                            <option value="1">二階建て</option>
                        </select>
                    </div>
                    <button class="calc-btn" onclick="calculateSchedule()">ロードマップを生成</button>
                </div>

                <!-- 契約前の流れ（日付なし・常時表示・画面幅に合わせて自動縮小） -->
                <div class="pre-flow">
                    <span class="pre-flow-label">契約前の流れ</span>
                    <div class="pre-flow-viewport">
                        <ul class="pre-flow-list">
                            <li class="pre-flow-item">
                                <span class="material-symbols-outlined">forum</span>
                                <span>ご相談・ヒアリング</span>
                            </li>
                            <span class="pre-flow-arrow material-symbols-outlined">arrow_forward</span>
                            <li class="pre-flow-item">
                                <span class="material-symbols-outlined">request_quote</span>
                                <span>土地のご提案</span>
                            </li>
                            <span class="pre-flow-arrow material-symbols-outlined">arrow_forward</span>
                            <li class="pre-flow-item">
                                <span class="material-symbols-outlined">house</span>
                                <span>プランのご提案</span>
                            </li>
                            <span class="pre-flow-arrow material-symbols-outlined">arrow_forward</span>
                            <li class="pre-flow-item"> 
                                <span class="material-symbols-outlined">payments</span>
                                <span>お見積り</span>
                            </li>
                            <span class="pre-flow-arrow material-symbols-outlined">arrow_forward</span>
                            <li class="pre-flow-item is-goal">
                                <span class="material-symbols-outlined">edit_document</span>
                                <span>ご契約</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div id="result" class="timeline-result-area"></div>
            </div>
        </main>

        <div data-include="common/footer.html"></div>

    </div>

    <script>
    // 工期計算スクリプト
            function calculateSchedule() {
                const dateInput = document.getElementById('contractDate').value;
                if (!dateInput) { alert('ご契約予定日を選択してください。'); return; }

                // 0: 平屋, 1: 二階建て
                const typeIndex = parseInt(document.getElementById('buildingType').value);

                const baseDate = new Date(dateInput);

                // 契約日から累計何日後かを渡すと、「〇月上旬/中旬/下旬」の文字列を返す
                function getFormattedDate(totalDays) {
                    const d = new Date(baseDate.getTime());
                    d.setDate(d.getDate() + totalDays);

                    const day = d.getDate();
                    let period;
                    if (day <= 10) {
                        period = "上旬～";
                    } else if (day <= 20) {
                        period = "中旬～";
                    } else {
                        period = "下旬～";
                    }

                    return `${d.getFullYear()}年 ${d.getMonth() + 1}月${period}`;
                }

                // ★ 長期休暇の判定：ここの日付範囲を変えれば毎年の休暇期間を調整できます
                function isHoliday(date) {
                    const m = date.getMonth() + 1; // 1〜12
                    const d = date.getDate();

                    // ゴールデンウィーク（4/29～5/5）
                    if ((m === 4 && d >= 29) || (m === 5 && d <= 5)) return true;

                    // お盆休み（8/13～8/16）
                    if (m === 8 && d >=  13 && d <= 16) return true;

                    // 年末年始（12/27～1/7）
                    if (m === 12 && d >= 27) return true;
                    if (m === 1 && d <= 7) return true;

                    return false;
                }

                // 指定した開始日からnumDays日間のうち、休暇日が何日含まれるかを数える
                function countHolidaysInRange(startDate, numDays) {
                    let count = 0;
                    for (let i = 0; i < numDays; i++) {
                        const d = new Date(startDate.getTime());
                        d.setDate(d.getDate() + i);
                        if (isHoliday(d)) count++;
                    }
                    return count;
                }

                // 契約後の詳細ステップ
                // ★ days：[平屋の日数, 二階建ての日数]。「この工程が完了し、次の工程に移るまで何日かかるか」を指定します
                // ★ title・desc・icon も自由に書き換えてください
                const steps = [
                    { days: [0, 0],   icon: "edit_document",        title: "建物のご契約",                desc: "当社と建物契約を行い、たのしい家づくりが本格的にスタートします🤝" },
                    { days: [0, 0],   icon: "edit_document",        title: "土地のご契約",                desc: "計画中の土地の売買契約を結ぶ🤝" },
                    { days: [7, 7], icon: "account_balance",        title: "融資本申込み",                desc: "住宅ローンをご利用の場合、金融機関へ本申込みを行います。" },
                    { days: [30, 70],   icon: "architecture",       title: "図面最終確定",                desc: "窓の高さや壁の位置など、図面の最終確認を行い、指定の機関に申請します✒️" },
                    { days: [7, 7],   icon: "straighten",           title: "遣り方確認～地鎮祭（起工式）",  desc: "建物の配置を確認していただきます。<br>あわせて、この頃にご希望の方は地鎮祭（起工式）を行います🙏" },
                    { days: [30, 30], icon: "construction",         title: "着工（基礎工事）",             desc: "いよいよ基礎工事が始まります！" },
                    { days: [2, 2], icon: "layers",                 title: "土台敷き",                    desc: "当社専属大工による工事がスタートします。<br>基礎の上に木材が据えられ、建物の骨組みを組み上げる準備を行います。" },
                    { days: [7, 7],  icon: "foundation",            title: "上棟",                        desc: "建物の骨組みが組み上がり、家の全体像が見えてきます。" },
                    { days: [14, 14], icon: "window",               title: "外断熱工事",                  desc: "サッシ（窓や玄関ドア）、外断熱材（旭化成ネオマフォーム）を取り付けを行います。<br>当社独自の優れた『桁上断熱工法』を採用し、隙間を許さない徹底した高気密施工を行います。<br>家全体をすっぽりと包み込むことで、夏は涼しく冬は暖かい、一年中快適な住空間を実現します。この工程が完了すると、内部の工事に進みます。" },
                    { days: [30, 40], icon: "carpenter",            title: "内部工事",                    desc: "内部工事では、お客様と当社専属コーディネーターとのお打ち合わせ内容をもとに造作工事を進めていきます。<br>この工程が完了したら大工さんの作業がすべて終了します。" },
                    { days: [20, 20], icon: "imagesearch_roller",   title: "仕上げ工事",                  desc: "クロスや照明器具、スイッチやコンセントなどを取付けます。<br>内装、設備など最終的な仕上げを行います。" },
                    { days: [0, 0],   icon: "request_quote",        title: "金消契約",                    desc: "金融機関にて住宅ローンの契約を行います。" },
                    { days: [7, 7],   icon: "inventory",            title: "お引渡し準備",                desc: "室内外の美装完了後、工事に携わった施工業者による点検を行います✨️" },
                    { days: [0, 0],   icon: "task_alt",             title: "完成・完了検査",              desc: "第三者機関による完了検査を実施します。" },
                    { days: [0, 0],   icon: "vpn_key",              title: "お引渡し",                   desc: "お客様とこまいホームとの長いお付き合いが始まります。<br>末永く快適なご住まいをお届けいたします。" }
                ];

                const resultDiv = document.getElementById('result');
                let htmlContent = '<div class="visual-timeline">';
                let cumulativeDays = 0;

                steps.forEach((step, index) => {
                    const isLast = index === steps.length - 1 ? 'is-final' : '';
                    htmlContent += `
                        <div class="v-node ${isLast}">
                            <div class="v-icon-wrap"><span class="material-symbols-outlined">${step.icon}</span></div>
                            <div class="v-content">
                                <div class="v-date">${getFormattedDate(cumulativeDays)}</div>
                                <h4 class="v-title">${step.title}</h4>
                                <p class="v-desc">${step.desc}</p>
                            </div>
                        </div>
                    `;

                    const baseDays = step.days[typeIndex];
                    const stepStartDate = new Date(baseDate.getTime());
                    stepStartDate.setDate(stepStartDate.getDate() + cumulativeDays);
                    const holidayExtra = countHolidaysInRange(stepStartDate, baseDays);

                    cumulativeDays += baseDays + holidayExtra;
                });
                htmlContent += '</div>';
                
                resultDiv.style.opacity = 0;
                resultDiv.innerHTML = htmlContent;
                setTimeout(() => {
                    resultDiv.style.transition = "opacity 0.6s ease";
                    resultDiv.style.opacity = 1;
                }, 50);
            }

        // 契約前の流れ：画面幅に合わせて自動スケールする仕組み
        function fitPreFlow() {
            const viewport = document.querySelector('.pre-flow-viewport');
            const list = document.querySelector('.pre-flow-list');
            if (!viewport || !list) return;

            list.style.transform = 'none';
            const naturalWidth = list.scrollWidth;
            const availableWidth = viewport.clientWidth;
            const scale = Math.min(1, availableWidth / naturalWidth);

            list.style.transform = `scale(${scale})`;
            list.style.transformOrigin = 'left top';
            viewport.style.height = list.getBoundingClientRect().height + 'px';
        }

        window.addEventListener('load', fitPreFlow);
        window.addEventListener('resize', fitPreFlow);
    </script>

    <script src="js/gift-tracker.js" data-page-id="flow"></script>

    <script src="js/common-parts.js"></script>
</body>
</html>
