<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | KOMAI HOME</title>
    <meta name="description" content="株式会社こまいホームへのお問い合わせはこちらから。">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KOMAI HOME">
    <meta property="og:title" content="お問い合わせ | KOMAI HOME">
    <meta property="og:description" content="株式会社こまいホームへのお問い合わせはこちらから。">
    <meta property="og:image" content="https://komai-home.co.jp/images/common/icon/ogp.png">
    <meta property="og:url" content="https://komai-home.co.jp/contact.html">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="images/common/icon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/common/icon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/common/icon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/common/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/common/icon/icon-512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

    <div class="wrapper">
        <main class="sub-main">
            <h1 class="page-title">CONTACT</h1>
            <p class="page-subtitle">〜 お問い合わせ 〜</p>

            <div class="contact-container">
                <a href="tel:0166322009" class="contact-strip">
                    <div class="contact-strip-avatar">
                        <span class="material-symbols-outlined">call</span>
                    </div>
                    <div class="contact-strip-text">
                        <span class="contact-strip-name">お電話でのお問い合わせ</span>
                        <span class="contact-strip-sub">0166-32-2009（8:30-17:30）</span>
                    </div>
                    <span class="contact-strip-btn">電話をかける</span>
                </a>

                <form id="contactForm" class="contact-form">
                    <div class="contact-field">
                        <label for="contactName">お名前</label>
                        <input type="text" id="contactName" class="stylish-input" required>
                    </div>
                    <div class="contact-field">
                        <label for="contactEmail">メールアドレス</label>
                        <input type="email" id="contactEmail" class="stylish-input" required>
                    </div>
                    <div class="contact-field">
                        <label for="contactCategory">お問い合わせ内容</label>
                        <select id="contactCategory" class="stylish-input" required>
                            <option value="" disabled selected>選択してください</option>
                            <option value="問い合わせ内容を指定しない">問い合わせ内容を指定しない</option>
                            <option value="新築を検討している">新築を検討している</option>
                            <option value="リフォーム・リノベーションを検討している">リフォーム・リノベーションを検討している</option>
                            <option value="メンテナンスの依頼">メンテナンスの依頼</option>
                            <option value="採用について">採用について</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="contact-field">
                        <label for="contactMessage">本文</label>
                        <textarea id="contactMessage" class="stylish-input contact-textarea" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="subscribe-btn contact-submit-btn" id="contactSubmitBtn" disabled>送信する</button>
                </form>
                <p class="subscribe-message" id="contactMessageResult"></p>
            </div>
        </main>

        <footer>
            <div class="social-icons">
                <a href="about.html">ご案内</a>
                <a href="contact.html">お問い合わせ</a>
                <a href="https://www.instagram.com/komaihome_official/?" target="_blank" rel="noopener noreferrer">インスタ</a>
                <a href="https://www.facebook.com/profile.php?id=100057272387014&locale=km_KH#" target="_blank" rel="noopener noreferrer">フェイスブック</a>
            </div>
            <div>&copy; KOMAI HOME Co., Ltd. All right Reserved</div>
        </footer>
    </div>

    <script>
        const CONTACT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwsoJR0lG4lOl1aUF5vWQZw0JvzJXxnSSLbfK1EugRgkje2c3FZpVep54pnYl5WVQUB/exec';

        const contactForm = document.getElementById('contactForm');
        const contactResult = document.getElementById('contactMessageResult');
        const contactSubmitBtn = document.getElementById('contactSubmitBtn');

        const contactInputs = [
            document.getElementById('contactName'),
            document.getElementById('contactEmail'),
            document.getElementById('contactCategory'),
            document.getElementById('contactMessage'),
        ];

        function updateContactSubmitState() {
            const allFilled = contactInputs.every(el => el.value.trim() !== '');
            contactSubmitBtn.disabled = !allFilled;
        }

        contactInputs.forEach(el => {
            el.addEventListener('input', updateContactSubmitState);
            el.addEventListener('change', updateContactSubmitState);
        });

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const category = document.getElementById('contactCategory').value;
            const message = document.getElementById('contactMessage').value.trim();
            if (!name || !email || !category || !message) return;

            contactSubmitBtn.disabled = true;
            contactSubmitBtn.textContent = '送信中...';
            contactResult.textContent = '';
            contactResult.className = 'subscribe-message';

            fetch(CONTACT_GAS_URL, {
                method: 'POST',
                body: new URLSearchParams({ name, email, category, message }),
            })
                .then(res => res.json())
                .then(data => {
                    contactResult.textContent = data.message;
                    contactResult.classList.add(data.result === 'success' ? 'is-success' : 'is-error');
                    if (data.result === 'success') contactForm.reset();
                })
                .catch(() => {
                    contactResult.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
                    contactResult.classList.add('is-error');
                })
                .finally(() => {
                    contactSubmitBtn.textContent = '送信する';
                    updateContactSubmitState();
                });
        });
    </script>

</body>
</html>
