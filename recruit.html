<body>

                    <div class="about-link-grid">
                        <a href="recruit/sekokanri.html" class="about-link-card js-recruit-job">

    <!-- 職種詳細モーダル -->
    <div class="gift-modal-overlay" id="recruitModalOverlay">
        <div class="gift-modal gift-modal--wide">
            <button type="button" class="gift-modal-close" id="recruitModalClose" aria-label="閉じる">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="gift-modal-body" id="recruitModalBody"></div>
        </div>
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('recruitModalOverlay');
            const body = document.getElementById('recruitModalBody');
            const closeBtn = document.getElementById('recruitModalClose');

            function closeModal() {
                overlay.classList.remove('is-active');
            }

            document.querySelectorAll('.js-recruit-job').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const url = link.getAttribute('href');

                    body.innerHTML = '<p class="gift-modal-text">読み込み中...</p>';
                    overlay.classList.add('is-active');

                    fetch(url)
                        .then(res => res.text())
                        .then(html => {
                            const doc = new DOMParser().parseFromString(html, 'text/html');
                            const content = doc.getElementById('recruitJobBody');
                            body.innerHTML = content
                                ? content.innerHTML
                                : '<p class="gift-modal-text">読み込みに失敗しました。</p>';
                        })
                        .catch(function () {
                            body.innerHTML = '<p class="gift-modal-text">読み込みに失敗しました。お手数ですが直接ページを開いてください。</p>';
                        });
                });
            });

            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeModal();
            });
        })();
    </script>
</body>
