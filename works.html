    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isHoverCapable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            const CYCLE_INTERVAL = 1200; // ms間隔で画像を巡回

            document.querySelectorAll('.work-card').forEach((card) => {
                const thumbs = card.querySelectorAll('.work-thumb');
                if (thumbs.length <= 1) return;

                let currentIndex = 0;
                let timerId = null;

                const setActive = (index) => {
                    thumbs.forEach((thumb, i) => {
                        thumb.classList.toggle('active', i === index);
                    });
                    card.classList.toggle('is-cycling', index !== 0);
                };

                const advance = () => {
                    currentIndex = (currentIndex + 1) % thumbs.length;
                    setActive(currentIndex);
                };

                const startCycle = () => {
                    stopCycle();
                    advance();
                    timerId = setInterval(() => {
                        currentIndex = (currentIndex + 1) % thumbs.length;
                        setActive(currentIndex);
                    }, CYCLE_INTERVAL);
                };

                const stopCycle = () => {
                    if (timerId) {
                        clearInterval(timerId);
                        timerId = null;
                    }
                    currentIndex = 0;
                    setActive(0);
                };

                if (isHoverCapable) {
                    card.addEventListener('mouseenter', startCycle);
                    card.addEventListener('mouseleave', stopCycle);
                } else if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                startCycle();
                            } else {
                                stopCycle();
                            }
                        });
                    }, { threshold: 0.6 });
                    observer.observe(card);
                }
            });

            const worksGrid = document.getElementById('worksGrid');
            if (worksGrid) {
                worksGrid.addEventListener('wheel', (e) => {
                    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                        e.preventDefault();
                        worksGrid.scrollLeft += e.deltaY;
                    }
                }, { passive: false });
            }

            // ==========================================
            // ハッシュタグ絞り込みフィルター
            // ==========================================
            const cards = Array.from(document.querySelectorAll('.work-card'));
            const filterBar = document.getElementById('workFilter');

            // 各カードのdata-tagsから、重複のないタグ一覧を初出順で作成
            const allTags = [];
            cards.forEach((card) => {
                const tags = (card.dataset.tags || '').split(',').map(t => t.trim()).filter(Boolean);
                tags.forEach((tag) => {
                    if (!allTags.includes(tag)) allTags.push(tag);
                });
            });

            // 「すべて」＋各タグのボタンを生成
            const buttonsHtml = [
                `<button class="filter-tag is-active" data-filter="all">すべて</button>`,
                ...allTags.map(tag => `<button class="filter-tag" data-filter="${tag}">#${tag}</button>`)
            ].join('');
            filterBar.innerHTML = buttonsHtml;

            filterBar.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-tag');
                if (!btn) return;

                filterBar.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('is-active'));
                btn.classList.add('is-active');

                const filter = btn.dataset.filter;
                cards.forEach((card) => {
                    const tags = (card.dataset.tags || '').split(',').map(t => t.trim());
                    const match = filter === 'all' || tags.includes(filter);
                    card.classList.toggle('is-filtered-out', !match);
                });

                // フィルター切り替え時に横スクロール位置を先頭に戻す
                worksGrid.scrollTo({ left: 0, behavior: 'smooth' });
            });
        });
    </script>

    <script>
        (function () {
            const PAGE_ID = 'works'; 
            const STORAGE_KEY = 'komaiGift';
            const TARGET_PAGES = ['concept', 'works', 'voice', 'flow'];

            function loadState() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
                } catch (e) {
                    return {};
                }
            }
            function saveState(state) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            }

            const state = loadState();
            state.visited = state.visited || {};

            const wasComplete = TARGET_PAGES.every(id => state.visited[id]);
            const showFirstVisitModal = !state.firstModalShown;

            state.visited[PAGE_ID] = true;
            if (showFirstVisitModal) state.firstModalShown = true;

            const nowComplete = TARGET_PAGES.every(id => state.visited[id]);
            const showUnlockModal = nowComplete && !wasComplete && !state.unlockModalShown;
            if (showUnlockModal) state.unlockModalShown = true;

            saveState(state);

            if (!showFirstVisitModal && !showUnlockModal) return;

            function buildModal(title, text) {
                const overlay = document.createElement('div');
                overlay.className = 'gift-modal-overlay';
                overlay.innerHTML =
                    '<div class="gift-modal">' +
                        '<button type="button" class="gift-modal-close" aria-label="閉じる">' +
                            '<span class="material-symbols-outlined">close</span>' +
                        '</button>' +
                        '<div class="gift-modal-body">' +
                            '<p class="gift-modal-title">' + title + '</p>' +
                            '<p class="gift-modal-text">' + text + '</p>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(overlay);
                requestAnimationFrame(function () { overlay.classList.add('is-active'); });

                function close() {
                    overlay.classList.remove('is-active');
                    setTimeout(function () { overlay.remove(); }, 300);
                }
                overlay.querySelector('.gift-modal-close').addEventListener('click', close);
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) close();
                });
            }

            if (showUnlockModal) {
                buildModal(
                    'ギフト獲得！',
                    '4ページすべてご覧いただき、ありがとうございます。ギフトが解放されました。好きなタイミングでTOPページに戻って受け取ってください。'
                );
            } else if (showFirstVisitModal) {
                buildModal(
                    'ちょっとしたお知らせ',
                    'コンセプト・施工事例・お客様の声・家づくりの流れ、4つのページすべてをご覧いただいた方に、ささやかなギフトをご用意しています。'
                );
            }
        })();
    </script>
